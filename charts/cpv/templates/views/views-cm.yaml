{{- if .Values.views.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: views-config
data:
  domain: "{{ .Values.views.settings.domain }}"
  start_date: "{{ .Values.views.settings.startDate }}"
  log_level: "{{ .Values.views.log.level }}"
  port: "{{ .Values.views.port }}"
  cors: "{{ .Values.views.settings.cors }}"
{{- end }}
